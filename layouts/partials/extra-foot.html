{{ if .IsPage }}
<script>
(function() {
  // ==========================================
  // 阅读进度条
  // ==========================================
  var bar = document.createElement('div');
  bar.className = 'reading-progress';
  bar.style.width = '0%';
  document.body.appendChild(bar);

  function updateProgress() {
    var scrollTop = window.scrollY;
    var docHeight = document.documentElement.scrollHeight - window.innerHeight;
    if (docHeight > 0) {
      bar.style.width = Math.min((scrollTop / docHeight) * 100, 100) + '%';
    }
  }
  window.addEventListener('scroll', updateProgress, { passive: true });
  updateProgress();

  // ==========================================
  // 代码块语言标签
  // ==========================================
  document.querySelectorAll('.highlight').forEach(function(block) {
    var code = block.querySelector('code[data-lang]');
    if (!code) return;
    var lang = code.getAttribute('data-lang');
    if (!lang || lang === 'fallback' || lang === 'text') return;

    // 友好名称映射
    var names = {
      bash: 'Bash', json: 'JSON', json5: 'JSON5', yaml: 'YAML',
      python: 'Python', javascript: 'JS', typescript: 'TS',
      go: 'Go', markdown: 'Markdown', toml: 'TOML', css: 'CSS',
      html: 'HTML', sql: 'SQL', java: 'Java', docker: 'Docker',
      shell: 'Shell', gdscript3: 'GDScript'
    };

    var label = document.createElement('span');
    label.className = 'code-lang-label';
    label.textContent = names[lang] || lang.toUpperCase();
    block.appendChild(label);
  });

  // ==========================================
  // 图片点击放大（灯箱）
  // ==========================================
  var contentEl = document.querySelector('.content');
  if (contentEl) {
    contentEl.querySelectorAll('img').forEach(function(img) {
      img.addEventListener('click', function() {
        var overlay = document.createElement('div');
        overlay.className = 'img-lightbox';
        var clone = document.createElement('img');
        clone.src = img.src;
        clone.alt = img.alt;
        overlay.appendChild(clone);
        document.body.appendChild(overlay);
        document.body.style.overflow = 'hidden';

        requestAnimationFrame(function() {
          overlay.classList.add('active');
        });

        function close() {
          overlay.classList.remove('active');
          setTimeout(function() {
            overlay.remove();
            document.body.style.overflow = '';
          }, 300);
        }

        overlay.addEventListener('click', close);
        document.addEventListener('keydown', function handler(e) {
          if (e.key === 'Escape') {
            close();
            document.removeEventListener('keydown', handler);
          }
        });
      });
    });
  }

  // ==========================================
  // TOC 默认展开 + 滚动高亮
  // ==========================================
  var toc = document.getElementById('toc');
  if (toc) {
    // 只在宽屏（>=1300px，与主题断点一致）默认展开 TOC
    if (window.innerWidth >= 1300) {
      toc.style.display = 'block';
      toc.classList.add('show-toc');
    }
  }

  var tocLinks = document.querySelectorAll('#TableOfContents a');
  if (tocLinks.length > 0) {
    var headings = [];
    tocLinks.forEach(function(link) {
      var id = decodeURIComponent(link.getAttribute('href').replace('#', ''));
      var heading = document.getElementById(id);
      if (heading) headings.push({ el: heading, link: link });
    });

    function highlightToc() {
      var scrollPos = window.scrollY + 100;
      var current = null;

      for (var i = 0; i < headings.length; i++) {
        if (headings[i].el.offsetTop <= scrollPos) {
          current = headings[i];
        }
      }

      tocLinks.forEach(function(link) {
        link.parentElement.classList.remove('active');
      });

      if (current) {
        current.link.parentElement.classList.add('active');
      }
    }

    window.addEventListener('scroll', highlightToc, { passive: true });
    highlightToc();
  }
})();
</script>
{{ end }}
