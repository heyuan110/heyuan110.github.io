baseURL = "https://www.heyuan110.com/"
languageCode = "en"
defaultContentLanguage = "en"
title = "Bruce on AI Engineering"
theme = "hermit-V2"
googleAnalytics = "G-CT8E5N460D"

# ============================================
# SEO / Indexing
# ============================================
enableRobotsTXT = true
canonifyURLs = true

# Git info for last modified time
enableGitInfo = true

# Summary length
summaryLength = 150

# GA4
[services]
  [services.googleAnalytics]
    id = 'G-CT8E5N460D'

# ============================================
# Sitemap
# ============================================
[sitemap]
  changeFreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

# ============================================
# Taxonomies
# ============================================
[taxonomies]
  tag = "tags"
  category = "categories"

# ============================================
# Output formats (JSON for search)
# ============================================
[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

# ============================================
# RSS
# ============================================
[outputFormats]
  [outputFormats.RSS]
    mediaType = "application/rss+xml"
    baseName = "index"

# ============================================
# Markup
# ============================================
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    noClasses = false
    style = "monokai"
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

# ============================================
# Privacy - GDPR friendly
# ============================================
[privacy]
  [privacy.googleAnalytics]
    anonymizeIP = true
    respectDoNotTrack = true
    useSessionStorage = false

# ============================================
# Params
# ============================================
[params]
  description = "Practical AI engineering guides: Claude Code, AI Agents, LLM workflows, tool comparisons, and hands-on tutorials for developers."
  keywords = "Claude Code,AI Agent,AI coding tools,AI engineering,LLM,RAG,Prompt Engineering,AI workflow,Cursor,Codex CLI,MCP,AI programming"
  images = ["/images/og-image.webp"]

  # Theme
  themeColor = "#494f5c"
  accentColor = "#018472"

  # Author
  [params.author]
    name = "Bruce"
    about = "/about/"

  homeSubtitle = "AI Engineering Guides — Claude Code / AI Agents / Tool Comparisons / Workflows"

  # Features
  footerHideThemeName = true
  justifyContent = false
  relatedPosts = true
  code_copy_button = true

  homeSubtitlePrinter = true
  scrollToTop = true
  global_mathjax = false
  readTime = true
  shareSocial = true
  noIndexPages = ["404 Page not found"]
  usesAnimation = true

  # Giscus comments (GitHub Discussions)
  [params.giscus]
    repo = "heyuan110/heyuan110.github.io"
    repoID = "R_kgDOOGpYkg"
    category = "Announcements"
    categoryID = "DIC_kwDOOGpYks4C3HL9"
    mapping = "pathname"
    strict = "0"
    reactionsEnabled = "1"
    inputPosition = "bottom"
    theme = "dark_dimmed"
    lang = "en"

  # External libs
  mathjaxLib = "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"
  mermaidLib = "https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.esm.min.mjs"

  # Image gallery
  [params.gallery]
    enable = true
    thumbnail = "300"

  # Date formats
  [params.dateform]
    CopyrightDate = "2006"
    LongDate = "Jan 2, 2006"
    ShortDate = "Jan 2"
    NumDateShort = "2006-01-02"
    NumDateLong = "2006-01-02 15:04 -0700"

  # Social links
  [[params.socialLinks]]
    name = "x"
    url = "https://x.com/heyuan110"

  [[params.socialLinks]]
    name = "github"
    url = "https://github.com/heyuan110"

  [[params.socialLinks]]
    name = "rss"
    url = "/index.xml"

# ============================================
# Menu
# ============================================
[menu]
  # New English categories (for future content)
  [[menu.main]]
    name = "AI Guides"
    url = "categories/ai-guides/"
    weight = 10

  [[menu.main]]
    name = "Comparisons"
    url = "categories/comparisons/"
    weight = 11

  # All posts (includes both English and legacy Chinese)
  [[menu.main]]
    name = "Posts"
    url = "posts/"
    weight = 20

  [[menu.main]]
    name = "Tags"
    url = "tags/"
    weight = 21

  # Tools
  [[menu.main]]
    name = "Tools"
    url = "https://www.usemagictools.com/"
    weight = 30

  # About
  [[menu.main]]
    name = "About"
    url = "about/"
    weight = 90

# ============================================
# Related content
# ============================================
[related]
  includeNewer = true
  threshold = 80
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 80
  [[related.indices]]
    name = "date"
    weight = 10
